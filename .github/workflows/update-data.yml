# Ежедневное обновление данных: снимок элементов спутников Земли (CelesTrak) и спутников Луны и Марса
# (JPL Horizons), проверка тестами и выкладка сайта. Без этого встроенные снимки устаревают:
# у Horizons нет CORS, браузер не может запросить его сам, а CelesTrak может быть недоступен.
# Запуск вручную: вкладка Actions → «Обновление данных» → Run workflow.
name: Обновление данных

on:
  schedule:
    - cron: '17 3 * * *' # каждый день в 06:17 по Москве
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Свежие элементы орбит
        run: |
          npm run update:fallback
          npm run update:orbiters

      - name: Проверка модели на свежих данных
        run: npm test

      - name: Сохранить снимки в репозитории
        id: save
        run: |
          git add public/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898341+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Данные: свежие элементы орбит"
          git push -q
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Выложить сайт
        if: steps.save.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build
          touch dist/.nojekyll
          cd dist
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898341+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Публикация сайта"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
