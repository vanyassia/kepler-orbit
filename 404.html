<!doctype html>
<html lang="ru" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#081120" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <!-- Страница 404 GitHub Pages: открывается по любому неверному адресу, поэтому ссылки — от корня сайта -->
    <link rel="icon" type="image/svg+xml" href="/kepler-orbit/favicon.svg" />
    <title>Страница не найдена — Кеплер</title>
    <style>
      :root {
        --bg-0: #081120;
        --text-0: #e6eef8;
        --text-2: #758dac;
        --orbit: #46d6ff;
        --line: rgb(117 141 172 / 0.28);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg-0);
        color: var(--text-0);
        font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
      }
      body {
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
      }
      main {
        max-width: 34rem;
        text-align: center;
      }
      img {
        display: block;
        margin: 0 auto 28px;
      }
      .code {
        margin: 0 0 8px;
        color: var(--text-2);
        font-size: 13px;
        letter-spacing: 0.12em;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(22px, 5vw, 28px);
        font-weight: 600;
        text-wrap: balance;
      }
      p {
        margin: 0 0 28px;
        color: var(--text-2);
        font-size: 15px;
        line-height: 1.6;
        text-wrap: pretty;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 20px;
        border: 1px solid var(--orbit);
        border-radius: 999px;
        color: var(--orbit);
        font: inherit;
        font-size: 14px;
        text-decoration: none;
        transition: background-color 0.15s ease;
      }
      a:hover {
        background: rgb(70 214 255 / 0.12);
      }
      a:focus-visible {
        outline: 2px solid var(--orbit);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/kepler-orbit/logo.webp" alt="" width="64" height="64" />
      <p class="code">ОШИБКА 404</p>
      <h1>Такой страницы нет</h1>
      <p>Возможно, в адресе опечатка или ссылка устарела. Трассы спутников — на главной странице.</p>
      <a href="/kepler-orbit/">Открыть Кеплер</a>
    </main>
  </body>
</html>
